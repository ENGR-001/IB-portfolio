<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>
     <link rel="stylesheet" href="app.css">
</head>
<body>
    <section class="contact-section">
  <form class="contact-form" action="https://formspree.io/f/xdawzknd" method="POST" id="contactForm">
      <div class="form-logo">
    <img src="logo.png" alt="Ibrahim logo">
  </div>
    <h1>Start a Project</h1>
    <p class="form-intro">
      Interested in working together?  
      Fill in the form below and I’ll get back to you.
    </p>

    <fieldset>
      <legend>Your Details</legend>

      <label for="name">Full Name</label>
      <input type="text" id="name" name="full_name" required>

      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone">
      <label for="nation">Nationality</label>
      <input type="text" id="nation" name="phone">
    </fieldset>

    <fieldset>
      <legend>Project Information</legend>

      <label for="project">Project Type</label>
      <select id="project" name="project_type" required>
        <option value="">-- Select Project Type --</option>
        <option value="portfolio">Portfolio Website</option>
        <option value="e-commerce">E-commerce Website</option>
        <option value="form">Forms</option>
        <option value="landing">Landing Page</option>
        <option value="signup">Signup Page</option>
        <option value="form">Login Page</option>
        <option value="other">Other</option>
      </select>

      <label for="message">Project Description</label>
      <textarea
        id="message"
        name="message"
        rows="6"
        placeholder="Briefly describe what you want to build..."
        required
      ></textarea>
    </fieldset>

    <div class="form-check">
      <input type="checkbox" id="agree" required>
      <label for="agree">I agree to be contacted regarding this project</label>
    </div>

    <div class="form-buttons">
      <button type="submit">Send Request</button>
      <button type="reset" class="secondary">Clear</button>
    </div>

  </form>
</section>

<script>
const form = document.getElementById('contactForm');

form.addEventListener('submit', function(e) {
  e.preventDefault(); // stop default submission

  const formData = new FormData(form);

  fetch(form.action, {
    method: form.method,
    body: formData,
    headers: { 'Accept': 'application/json' }
  }).then(response => {
    if (response.ok) {
      // Show success message
      const msg = document.createElement('div');
      msg.textContent = "Form submitted successfully! We'll get back to you soon.";
      msg.style.background = "#0dcfe4";
      msg.style.color = "#fff";
      msg.style.padding = "15px";
      msg.style.borderRadius = "6px";
      msg.style.textAlign = "center";
      msg.style.marginBottom = "15px";
      
      form.prepend(msg);

      form.reset(); // clear form fields

      // Remove message after 5 seconds
      setTimeout(() => msg.remove(), 5000);
    } else {
      alert("Oops! There was a problem submitting your form.");
    }
  }).catch(error => {
    alert("Oops! There was a problem submitting your form.");
  });
});
</script>
</body>
</html>
